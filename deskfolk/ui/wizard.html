<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meet Yasser</title>
    <style>
      /* ---- design tokens (from the UI spec) ---- */
      :root {
        color-scheme: dark;
        --panel: #18161b;
        --accent: #e8a13c;
        --accent-hi: #f2b45a;
        --mood: #e0564e;
        --online: #57c464;
        --rest: #8b93b5;
        --text: #ece7de;
        --text-2: #a79f92;
        --text-3: #6f6a60;
        --hair: rgba(255, 255, 255, 0.09);
        --inset: rgba(255, 255, 255, 0.045);
        --inset-2: rgba(255, 255, 255, 0.07);
        --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
        --mono: Consolas, "Cascadia Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #141217;
        color: var(--text);
        font: 13px/1.55 var(--sans);
        user-select: none;
        -webkit-user-select: none;
      }
      /* ---- window shell ---- */
      .win {
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: radial-gradient(120% 120% at 20% -10%, #221d26 0%, #16131a 55%, #100e13 100%);
      }
      .titlebar {
        height: 40px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        padding: 0 8px 0 16px;
        gap: 8px;
      }
      .titlebar .brand {
        font: 600 12px/1 var(--mono);
        letter-spacing: 0.22em;
        color: var(--text-3);
        text-transform: uppercase;
      }
      .titlebar .spacer {
        flex: 1;
      }
      .xbtn {
        width: 30px;
        height: 26px;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: var(--text-3);
        font-size: 15px;
        cursor: pointer;
      }
      .xbtn:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
      }
      /* ---- step body ---- */
      .body {
        flex: 1;
        overflow-y: auto;
        padding: 6px 40px 8px;
      }
      .body::-webkit-scrollbar {
        width: 8px;
      }
      .body::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
      }
      .step-tag {
        font: 600 11px/1 var(--mono);
        letter-spacing: 0.2em;
        color: var(--accent);
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0 4px;
        font: 650 26px/1.15 var(--sans);
        letter-spacing: -0.01em;
      }
      h2 {
        margin: 14px 0 4px;
        font: 650 21px/1.2 var(--sans);
      }
      .lede {
        margin: 0 0 6px;
        color: var(--text-2);
        max-width: 60ch;
      }
      /* his own words are always mono */
      .say {
        font-family: var(--mono);
        color: var(--text-2);
        background: var(--inset);
        border: 1px solid var(--hair);
        border-radius: 10px;
        padding: 10px 12px;
        margin: 12px 0;
      }
      .muted {
        color: var(--text-3);
      }
      /* ---- footer / nav ---- */
      .footer {
        flex: 0 0 auto;
        height: 62px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 40px;
        border-top: 1px solid var(--hair);
      }
      .dots {
        display: flex;
        gap: 6px;
        flex: 1;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.18);
        transition: all 0.2s;
      }
      .dot.on {
        background: var(--accent);
        width: 18px;
      }
      /* ---- buttons ---- */
      .btn {
        font: 600 13px/1 var(--sans);
        padding: 10px 18px;
        border-radius: 8px;
        border: 1px solid var(--hair);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        cursor: pointer;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
        color: var(--text-3);
      }
      .btn.ghost:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
      }
      .btn.primary {
        background: var(--accent);
        border-color: transparent;
        color: #1b1206;
      }
      .btn.primary:hover {
        background: var(--accent-hi);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      /* ---- rows / controls ---- */
      .rows {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin: 10px 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 9px 0;
      }
      .row + .row {
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }
      .row .label {
        flex: 1;
        min-width: 0;
      }
      .row .label b {
        font-weight: 600;
      }
      .row .label small {
        display: block;
        color: var(--text-3);
        font-size: 12px;
      }
      .card {
        background: var(--inset);
        border: 1px solid var(--hair);
        border-radius: 12px;
        padding: 4px 16px;
        margin: 12px 0;
      }
      .lbl {
        font: 600 11px/1 var(--mono);
        letter-spacing: 0.18em;
        color: var(--text-3);
        text-transform: uppercase;
      }
      /* slider */
      .slider {
        width: 190px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 150px;
        height: 4px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        outline: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        border: 2px solid #1b1206;
      }
      .slider .val {
        width: 26px;
        text-align: right;
        font: 600 12px/1 var(--mono);
        color: var(--accent-hi);
      }
      /* segmented control */
      .seg {
        display: inline-flex;
        background: var(--inset);
        border: 1px solid var(--hair);
        border-radius: 9px;
        padding: 3px;
        gap: 3px;
      }
      .seg button {
        border: none;
        background: transparent;
        color: var(--text-2);
        font: 600 12px/1 var(--sans);
        padding: 7px 12px;
        border-radius: 6px;
        cursor: pointer;
      }
      .seg button.on {
        background: var(--accent);
        color: #1b1206;
      }
      /* toggle */
      .toggle {
        width: 40px;
        height: 23px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.12);
        border: none;
        position: relative;
        cursor: pointer;
        flex: 0 0 auto;
        transition: background 0.15s;
      }
      .toggle::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: #ece7de;
        transition: left 0.15s;
      }
      .toggle.on {
        background: var(--accent);
      }
      .toggle.on::after {
        left: 20px;
      }
      /* text field */
      .field {
        width: 100%;
        background: var(--inset);
        border: 1px solid var(--hair);
        border-radius: 8px;
        color: var(--text);
        font: 500 14px/1 var(--sans);
        padding: 11px 12px;
        outline: none;
      }
      .field:focus {
        border-color: var(--accent);
      }
      select.field {
        cursor: pointer;
      }
      /* character chips */
      .chips {
        display: flex;
        gap: 12px;
        margin: 14px 0;
        flex-wrap: wrap;
      }
      .chip {
        width: 84px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      .chip .av {
        width: 66px;
        height: 66px;
        border-radius: 50%;
        background: var(--inset-2);
        border: 2px solid transparent;
        display: grid;
        place-items: center;
        overflow: hidden;
        font: 600 24px/1 var(--sans);
        color: var(--text-3);
      }
      .chip .av img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 22%;
        image-rendering: pixelated;
      }
      .chip.on .av {
        border-color: var(--accent);
      }
      .chip .nm {
        font-size: 12px;
        color: var(--text-2);
      }
      .chip.soon {
        opacity: 0.5;
        cursor: default;
      }
      /* error card */
      .alert {
        background: rgba(224, 86, 78, 0.07);
        border: 1px solid rgba(224, 86, 78, 0.35);
        border-radius: 10px;
        padding: 11px 13px;
        margin: 12px 0;
      }
      .alert .say {
        background: none;
        border: none;
        padding: 0;
        margin: 6px 0 0;
      }
      .center {
        display: grid;
        place-content: center;
        text-align: center;
        min-height: 340px;
        gap: 4px;
      }
      .big-av {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        margin: 0 auto 8px;
        background: var(--inset-2);
        overflow: hidden;
        border: 2px solid var(--hair);
        display: grid;
        place-items: center;
        font: 600 44px/1 var(--sans);
        color: var(--text-3);
      }
      .big-av img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 20%;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div class="win">
      <div class="titlebar" data-tauri-drag-region>
        <span class="brand">DeskFolk</span>
        <span class="spacer"></span>
        <button class="xbtn" id="close" title="Close">&#10005;</button>
      </div>
      <div class="body" id="app"><!-- steps render here --></div>
      <div class="footer">
        <button class="btn ghost" id="back">Back</button>
        <div class="dots" id="dots"></div>
        <button class="btn primary" id="next">Next</button>
      </div>
    </div>
    <script type="module" src="/src/wizard/main.ts"></script>
  </body>
</html>
